services:
  db:
    image: postgres:16
    container_name: aimentum-db
    environment:
      POSTGRES_USER: aimentum
      POSTGRES_PASSWORD: aimentum
      POSTGRES_DB: aimentum
    ports:
      - "5432:5432"
    volumes:
      - db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U aimentum -d aimentum"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  db_data:
